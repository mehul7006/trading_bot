# Win-rate log is persisted to a Render Postgres (already deployed separately)
# because Render's free web filesystem is ephemeral — that was the null-accuracy
# cause. DATABASE_URL is set manually (see envVars below) to point at that DB.
services:
  - type: web
    name: option-analyzer-bot
    env: docker
    plan: free
    region: singapore
    branch: OptionMaster
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: UPSTOX_API_KEY
        sync: false
      - key: UPSTOX_API_SECRET
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      # Long-lived "extended" Upstox token (valid for months). Used automatically
      # as a fallback when the daily UPSTOX_ACCESS_TOKEN is missing/expired (401),
      # so the bot keeps fetching data even if you forget the daily refresh.
      - key: UPSTOX_FALLBACK_TOKEN
        sync: false
      # Internal Database URL of your already-deployed Render Postgres. Paste it
      # in the dashboard (Environment tab). The bot auto-creates its table on
      # first connect — no SQL/migrations needed.
      - key: DATABASE_URL
        sync: false
