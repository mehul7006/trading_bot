# Free Postgres persists the forward-test win-rate log across restarts/redeploys
# (Render's free web filesystem is ephemeral, which is why accuracy was null).
databases:
  - name: option-analyzer-db
    plan: free
    region: singapore

services:
  - type: web
    name: option-analyzer-bot
    env: docker
    plan: free
    region: singapore
    branch: OptionMaster
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: UPSTOX_API_KEY
        sync: false
      - key: UPSTOX_API_SECRET
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      # Auto-injected by Render from the database above. If you created the
      # service WITHOUT a blueprint, instead add DATABASE_URL manually in the
      # dashboard (Internal Database URL of your Render Postgres).
      - key: DATABASE_URL
        fromDatabase:
          name: option-analyzer-db
          property: connectionString
